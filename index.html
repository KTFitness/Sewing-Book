<html lang="en-AU">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first app; sticky header with a tape-measure edge, cutting-mat grid ground, fixed bottom tab bar */
:root{
  --bg:#e9eee9; --grid:rgba(47,93,80,.07); --surface:#fbfcfa; --sunk:#f1f4f0;
  --ink:#1b2420; --muted:#5a6a63; --line:#d2dad4;
  --mat:#2c5a4d; --mat-ink:#ffffff; --mat-soft:#d9e8e1;
  --tape:#e3b236; --tape-ink:#2a2208; --danger:#b23a2e;
  --st-idea:#7a8781; --st-plan:#3f6f9c; --st-sew:#b9861a; --st-done:#2c7a5c; --st-off:#9a6a6a;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --grid:rgba(120,180,160,.05); --surface:#1b2320; --sunk:#161d1a;
  --ink:#e6ece9; --muted:#97a7a0; --line:#2d3a35;
  --mat:#6db49b; --mat-ink:#0d1a15; --mat-soft:#21352d;
  --tape:#e3b236; --tape-ink:#2a2208; --danger:#e07467;
  --st-idea:#8d9a94; --st-plan:#7fa9d4; --st-sew:#e0b44e; --st-done:#6dc29d; --st-off:#c99494;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --grid:rgba(120,180,160,.05); --surface:#1b2320; --sunk:#161d1a;
  --ink:#e6ece9; --muted:#97a7a0; --line:#2d3a35;
  --mat:#6db49b; --mat-ink:#0d1a15; --mat-soft:#21352d;
  --tape:#e3b236; --tape-ink:#2a2208; --danger:#e07467;
  --st-idea:#8d9a94; --st-plan:#7fa9d4; --st-sew:#e0b44e; --st-done:#6dc29d; --st-off:#c99494;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mat)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mat)}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--mat);color:var(--mat-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--tape);
  background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 5px),repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 25px);
  background-size:100% 4px,100% 8px;background-repeat:no-repeat;background-position:0 0,0 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:12px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.icon-btn{background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:inherit}

main{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{background:var(--tape);color:var(--tape-ink);border-radius:var(--r);padding:10px 14px;font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--mat);color:var(--mat-ink);border-color:var(--mat)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 11px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tag{display:inline-block;font-size:12px;background:var(--mat-soft);color:var(--ink);border-radius:999px;padding:2px 9px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--st-idea))}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:4/5;max-width:100%;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:28px;overflow:hidden}
.card .ph img,.card .ph video{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:8px}
.grid-cards.pat{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.card .ph.tlph{aspect-ratio:3/4}
.grid-cards.pat .card .t{font-size:13px}.grid-cards.pat .card .s{font-size:12px}
.tlbig{width:260px;max-width:78%;margin-inline:auto;aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background-color:var(--sunk)}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%}
.li .th{width:56px;height:56px;flex:none;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-family:var(--display);color:var(--muted)}
.li .th img{width:100%;height:100%;object-fit:cover}
.li .tx{min-width:0;flex:1}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.masonry{columns:2 150px;column-gap:10px}
.masonry .card{break-inside:avoid;margin-bottom:10px;width:100%}
.masonry .card .ph{aspect-ratio:auto;min-height:90px}
.masonry .card .ph img{height:auto}

/* settings readout: the machine dial card */
.dial{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:12px;display:flex;flex-direction:column;gap:8px}
.dial .mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.dial .mn{font-weight:700}
.dial .use{font-size:13px;color:var(--muted)}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.readout div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.readout dt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.readout dd{margin:0;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.kv{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:4px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(7,1fr);max-width:900px;margin:0 auto}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0;white-space:nowrap}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--mat)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,15,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--bg);width:100%;max-width:720px;max-height:94vh;max-height:94dvh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheet .bar h2{font-size:19px;min-width:0;overflow-wrap:anywhere}
@media (min-width:760px){.sheet{align-items:center}.sheet .pane{border-radius:16px;max-height:88vh}}

form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
form label{font-size:13px;font-weight:600;color:var(--muted)}
form input,form select,form textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0}
form textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fh{font-family:var(--display);font-size:17px;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.setrow{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .tb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.thumbs .tb img,.thumbs .tb video{width:100%;height:100%;object-fit:cover}
.thumbs .tb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.rating{display:flex;gap:4px}
.rating button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono)}
.rating button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.lookup{background:var(--mat-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.gallery{display:flex;gap:8px;overflow-x:auto}
.gallery img,.gallery video{max-height:52vh;max-width:100%;border-radius:10px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90vw}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;accent-color:var(--mat)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.meas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;cursor:pointer;min-height:64px}
.tile .tn{font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tile .tc{font-family:var(--mono);font-size:13px;color:var(--mat);background:var(--mat-soft);border-radius:999px;padding:1px 8px;flex:none}
.tile.zero .tc{color:var(--muted);background:var(--sunk)}
.tile.zero .tn{color:var(--muted);font-weight:500}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li{padding-left:4px;line-height:1.45}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,42%) 1fr 2.5em;gap:10px;align-items:center;font-size:13px}
.bar span{overflow-wrap:anywhere}
.bar .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--mat);border-radius:5px}
.bar b{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.statgrid .n{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.minirow{display:grid;grid-template-columns:1fr 7em auto;gap:8px;align-items:end}
.costtable{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.costtable .amt{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.costtable .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 16px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--mat);color:var(--mat-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<header class="top">
  <div class="top-row">
    <div class="brand"><small>Kirsty's</small>Sewing Book</div>
    <button class="icon-btn" data-act="quickadd" id="qa">+ Add</button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections"><div class="in">

</div></nav>

<script>
const GARMENTS=["Top / tee","Shirt / blouse","Dress","Skirt","Pants / trousers","Shorts","Jeans","Jumpsuit","Jacket / coat","Cardigan / knitwear","Sweatshirt / hoodie","Activewear","Swimwear","Lingerie","Sleepwear","Bag / accessory","Other"];
const FABRICS=["Single jersey","Interlock","Rib knit","Ponte","French terry","Sweatshirt fleece","Scuba","Double knit","Swim lycra","Activewear knit","Mesh / powernet","Sweater knit",
 "Cotton lawn","Cotton poplin","Voile","Chambray","Shirting","Denim","Stretch denim","Linen","Linen blend","Viscose / rayon challis","Crepe","Silk","Satin","Chiffon / georgette","Twill","Gabardine","Wool suiting","Wool coating","Corduroy","Canvas","Tencel / lyocell","Broderie anglaise","Lace","Faux leather"];
const STATUSES=["Idea","Planned","Cutting","Sewing","Finished","Abandoned"];
const STCOL={Idea:"--st-idea",Planned:"--st-plan",Cutting:"--st-sew",Sewing:"--st-sew",Finished:"--st-done",Abandoned:"--st-off"};
const KINDS=["Inspiration","Pattern idea","Make idea","Alteration idea"];
const ALT_STATUSES=["To do","Planned","In progress","Done","Gave up"];
const ALTCOL={"To do":"--st-idea",Planned:"--st-plan","In progress":"--st-sew",Done:"--st-done","Gave up":"--st-off"};
const TIP_CATS=["Hems","Waistbands","Corners & points","Seams & seam finishes","Necklines & facings","Binding & bias","Collars","Zips","Buttons & buttonholes","Pockets","Sleeves & cuffs","Darts, pleats & gathers","Plackets & vents","Linings","Interfacing","Knits & stretch","Pressing","Cutting & marking","Embroidery","Alterations","Pattern making","Bags & straps","Machines & overlocker","Other","To sort"];
const BODY_AREAS=["Neck & neckline","Shoulders","Upper chest","Bust","Back","Armhole & underarm","Sleeves & arms","Waist","Tummy","Hips","Seat","Crotch & rise","Thighs","Knees & calves","Length & proportion","Overall"];
const FIT_GARMENTS=["All garments","Tops & blouses","Shirts","Knit tops & tees","Dresses","Skirts","Pants & shorts","Jeans","Jackets & coats","Jumpsuits","Swim & lingerie"];
const MKINDS=["Sewing machine","Overlocker","Coverstitch","Embroidery","Other"];
const NOTION_CATS=["Zip","Elastic","Interfacing","Buttons","Snaps / hardware","Thread","Bias binding","Tape / stay tape","Trim / lace","Needles","Other"];
const MEAS=["Height","High bust","Full bust","Under bust","Waist","High hip","Full hip","Nape to waist","Shoulder width","Across back","Arm length","Bicep","Wrist","Inseam","Outseam","Crotch depth (rise)","Thigh","Knee","Calf","Neck"];

const SCHEMA={
 makes:[
  {k:"title",l:"What are you making?",t:"text",req:1},
  {k:"status",l:"Status",t:"select",o:STATUSES},
  {k:"garment",l:"Garment type",t:"datalist",o:GARMENTS},
  {k:"patternId",l:"Pattern",t:"patpick"},
  {k:"size",l:"Size cut",t:"text",ph:"e.g. 12, graded to 14 at hip"},
  {h:"Fabric"},
  {k:"fabricId",l:"From my stash",t:"ref",ref:"fabrics"},
  {k:"fabricType",l:"Fabric type",t:"datalist",o:FABRICS},
  {k:"fibre",l:"Fibre content",t:"text",ph:"e.g. 95% cotton 5% elastane"},
  {k:"weight",l:"Weight",t:"text",ph:"e.g. 220 gsm, midweight"},
  {k:"stretch",l:"Stretch",t:"text",ph:"e.g. 50% 4-way"},
  {k:"prewash",l:"Pre-wash",t:"text",ph:"e.g. 30° wash, line dry"},
  {k:"_lookup",t:"lookup"},
  {h:"Machine settings"},
  {k:"settings",t:"settings"},
  {h:"Notions used"},
  {k:"notions",t:"notions"},
  {h:"Notes"},

function pastFor(fabricType,garment,excludeId){
  const f=norm(fabricType),g=norm(garment);if(!f&&!g)return[];
  return [...S.makes.map(m=>({...m,_col:"makes"})),...S.alterations.map(m=>({...m,_col:"alterations"}))].filter(m=>m.id!==excludeId).map(m=>{let s=0;
    if(f&&norm(m.fabricType)===f)s+=3;else if(f&&norm(m.fabricType)&&(norm(m.fabricType).includes(f)||f.includes(norm(m.fabricType))))s+=2;
    if(g&&norm(m.garment)===g)s+=2; if(s&&(m.settings||[]).length)s+=1; if(m.status==="Finished"||m.status==="Done")s+=.5;
    return {m,s}}).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s||(b.m.updatedAt||0)-(a.m.updatedAt||0)).map(x=>x.m);
}

function li(col,x){const p=firstPhoto(x);let sub="";

  if(col==="fabrics")sub=[x.fabricType,x.length,x.colour].filter(Boolean).join(" · ");

  <span class="tx"><div class="t">${esc(title(col,x))}</div><div class="s">${esc(sub)}</div></span>${col==="makes"?`<span class="pill" style="--c:var(${STCOL[x.status]||"--st-idea"})">${esc(x.status||"Idea")}</span>`:col==="alterations"?`<span class="pill" style="--c:var(${ALTCOL[x.status]||"--st-idea"})">${esc(x.status||"To do")}</span>`:""}</button>`}
function card(col,x){const p=firstPhoto(x);let sub="";

  if(col==="inspo")sub=[x.kind,x.garment,x.fabricType].filter(Boolean).join(" · ");
  if(col==="makes")sub=[x.status,x.fabricType].filter(Boolean).join(" · ");
  if(col==="patterns")sub=[x.designer,x.status==="Wishlist"?"Wishlist":""].filter(Boolean).join(" · ");
  if(col==="patterns"&&!p&&x.tlSlug){const t=S.tl.find(z=>z.s===x.tlSlug);const st=t&&tlThumb(t);if(st)return `<button class="card" data-act="open" data-col="patterns" data-id="${x.id}"><div class="ph tlph" style="${st}"></div><div class="body"><div class="t">${esc(title(col,x))}</div><div class="s">${esc(sub)}</div></div></button>`}

const LISTCONF={
 alterations:{h:"Alterations",chips:["All",...ALT_STATUSES],chipKey:"status",def:"To do",layout:"list",empty:"Log each alteration with the before and after, what you changed, and the machine settings you used."},
 makes:{h:"Makes",chips:["All",...STATUSES],chipKey:"status",layout:"list",empty:"Log each garment with its fabric, needles and settings so the next one is easier."},
 inspo:{h:"Inspo board",chips:["All",...KINDS],chipKey:"kind",layout:"masonry",empty:"Screenshots, photos, video tips and links all live here. Tag them by garment and fabric so they turn up later."},

 notions:{h:"Notions",chips:["All",...NOTION_CATS],chipKey:"category",layout:"list",empty:"Zips, elastic, interfacing, buttons, thread. Log them here and link them to makes."},

};
function listView(col){const c=LISTCONF[col];const chip=S.filters[col+"Chip"]||c.chips[0];const q=norm(S.filters[col+"Q"]);
  let items=col==="patterns"?[...S.patterns].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).concat(tlFree().map(tlAsPattern)):[...S[col]].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  if(col==="fabrics"){if(chip==="In stash")items=items.filter(x=>x.archived!=="Yes");else if(chip==="Used up")items=items.filter(x=>x.archived==="Yes")}
  else if(col==="patterns"&&chip==="Free")items=items.filter(x=>x.free||/(^|,)\s*free\s*(,|$)/i.test(x.tags||""));
  else if(col==="patterns"&&chip==="Made"){const made=new Set(S.makes.map(m=>m.patternId));items=items.filter(x=>made.has(x.id))}
  else if(chip!=="All")items=items.filter(x=>(x[c.chipKey]||c.def||(col==="makes"?"Idea":""))===chip);
  const gF=S.filters[col+"G"]||"";if(gF)items=items.filter(x=>norm(x.garment)===norm(gF));
  const fF=col==="patterns"?S.filters.patFab||"":"";if(fF)items=items.filter(x=>{const tg=x.fab||((x.tlSlug&&(S.tl.find(z=>z.s===x.tlSlug)||{}).tg)||{}).f||[];return tg.includes(fF)||norm(x.suggested).includes(norm(fF))});
  if(q){const words=q.split(/\s+/).filter(Boolean);items=items.filter(x=>{const tlx=x.tlSlug&&S.tl.find(z=>z.s===x.tlSlug);const hay=norm([x.name,x.title,x.designer,x.garment,x.types,x.fabricType,x.notes,x.tags,x.kind,x.category,x.colour,x.fibre,x.suggested,x.tltags,tlx&&tlx.tagText,x.source,x.brand,x.problem,x.altTypes,x.plan,x.construction].join(" "));return words.every(w=>hay.includes(w))})}
  const total=items.length;const lim=S.show[col]||60;items=items.slice(0,lim);
  const more=total>lim?`<div style="text-align:center"><button class="btn" data-act="more" data-col="${col}">Show more (${total-lim} left)</button></div>`:"";
  const empty=col==="patterns"?!S.patterns.length&&!S.tl.length:!S[col].length;
  const body=empty?`<div class="empty"><b>Nothing here yet</b>${c.empty}</div>`:!items.length?`<div class="empty">No matches.</div>`:
    c.layout==="list"?`<div class="list">${items.map(x=>li(col,x)).join("")}</div>`:
    c.layout==="masonry"?`<div class="masonry">${items.map(x=>card(col,x)).join("")}</div>`:`<div class="grid-cards${col==="patterns"?" pat":""}">${items.map(x=>card(col,x)).join("")}</div>`;
  const countLine=`<div class="muted" style="font-size:13px">${total} ${total===1?"item":"items"}${col==="patterns"&&S.tlMeta?` · Threadloop stash imported ${esc(S.tlMeta.importedOn||"")}`:""}</div>`;
  const gars=col==="notions"||col==="patterns"?[]:[...new Set(S[col].map(x=>x.garment).filter(Boolean))].sort();
  return `<div class="stack">
  <div class="row between"><h1>${c.h}</h1><div class="row">${col==="patterns"?`<button class="btn small" data-act="tlsync">Threadloop</button><button class="btn small" data-act="bulk">Paste a list</button>`:""}<button class="btn primary small" data-act="new" data-col="${col}">+ New</button></div></div>
  <input class="search" id="q-${col}" type="search" placeholder="Search ${c.h.toLowerCase()}" value="${esc(S.filters[col+"Q"]||"")}" data-q="${col}">
  <div class="chips" role="group" aria-label="Filter">${c.chips.map(ch=>`<button class="chip" aria-pressed="${ch===chip}" data-act="chip" data-col="${col}" data-v="${esc(ch)}">${esc(ch)}</button>`).join("")}</div>
  ${col==="patterns"&&S.tlTagged?`<div class="chips">${["","Woven","Knit","Stretch woven","Non-woven"].map(g=>`<button class="chip" aria-pressed="${g===(S.filters.patFab||"")}" data-act="fabchip" data-v="${esc(g)}">${esc(g||"Any fabric")}</button>`).join("")}</div>`:""}
  ${gars.length>1&&col!=="fabrics"?`<div class="chips">${["",...gars].map(g=>`<button class="chip" aria-pressed="${g===gF}" data-act="gchip" data-col="${col}" data-v="${esc(g)}">${esc(g||"Any garment")}</button>`).join("")}</div>`:""}
  ${countLine}${body}${more}</div>`}

function bars(pairs,max=8){pairs=pairs.sort((a,b)=>b[1]-a[1]).slice(0,max);if(!pairs.length)return `<div class="muted" style="font-size:13px">Nothing logged yet.</div>`;const top=pairs[0][1]||1;
  return `<div class="bars">${pairs.map(([l,n])=>`<div class="bar"><span>${esc(l)}</span><div class="tr"><i style="width:${Math.max(4,Math.round(n/top*100))}%"></i></div><b>${n}</b></div>`).join("")}</div>`}
function tally(list,fn){const m={};list.forEach(x=>{const k=fn(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m)}
function statsHTML(){const live=S.makes.filter(m=>m.status!=="Abandoned");const fin=S.makes.filter(m=>m.status==="Finished");
  const spent=S.makes.reduce((t,m)=>t+costTotal(m),0);const costed=fin.filter(m=>costTotal(m)>0);
  const owned=allPatterns().filter(p=>p.status!=="Wishlist");const made=new Set(S.makes.map(m=>m.patternId).filter(Boolean));
  const unmade=owned.filter(p=>!made.has(p.id));
  const patSpend=S.patterns.reduce((t,p)=>t+money(p.cost),0);
  const desMakes=tally(live,m=>{const p=m.patternId&&byId("patterns",m.patternId);return p&&p.designer});
  const years=tally(fin,m=>(m.finished||"").slice(0,4));
  return `<section class="panel stack"><div><div class="eyebrow">Stats</div><h1>Your sewing in numbers</h1></div>
  <div class="statgrid">
   <div><div class="n">${fin.length}</div><div class="eyebrow">Finished makes</div></div>
   <div><div class="n">${aud(spent)}</div><div class="eyebrow">Spent on makes</div></div>
   <div><div class="n">${costed.length?aud(costed.reduce((t,m)=>t+costTotal(m),0)/costed.length):"–"}</div><div class="eyebrow">Average per make</div></div>
   <div><div class="n">${owned.length?Math.round((owned.length-unmade.length)/owned.length*100)+"%":"–"}</div><div class="eyebrow">Patterns used</div></div>
   <div><div class="n">${aud(patSpend)}</div><div class="eyebrow">Spent on patterns</div></div>
  </div>
  <div class="stack" style="gap:8px"><h3>Most-made garments</h3>${bars(tally(live,m=>m.garment))}</div>
  <div class="stack" style="gap:8px"><h3>Designers you sew most</h3>${bars(desMakes)}</div>
  <div class="stack" style="gap:8px"><h3>Fabrics you sew most</h3>${bars(tally(live,m=>m.fabricType))}</div>
  <div class="stack" style="gap:8px"><h3>Patterns in your stash by designer</h3>${bars(tally(owned,p=>p.designer))}</div>
  ${years.length>1?`<div class="stack" style="gap:8px"><h3>Finished by year</h3>${bars(years.sort((a,b)=>b[0].localeCompare(a[0])),10)}</div>`:""}
  <div class="muted" style="font-size:14px">${unmade.length} of your ${owned.length} patterns haven't been made yet. The Patterns tab's "Made" filter shows the ones that have.</div>
  </section>`}

function openSheet(html){$("#pane").innerHTML=html;$("#sheet").hidden=false;$("#pane").scrollTop=0;document.body.style.overflow="hidden"}
function closeSheet(){$("#sheet").hidden=true;$("#pane").innerHTML="";document.body.style.overflow="";S.form=null}

function detail(col,id){const x=byId(col,id);if(!x)return;const sch=SCHEMA[col];
  const stepKeys=["steps","fix","garmentFix"];
  const rows=sch.filter(f=>f.k&&!["photos","settings","_lookup","_auto","notions","costs","title","name","tags",...stepKeys].includes(f.k)&&x[f.k]).map(f=>{let v=x[f.k];
    if(f.t==="ref"||f.t==="patpick"){const rc=f.ref||"patterns";const r=byId(rc,v);if(!r)return"";v=`<a href="#" data-act="open" data-col="${rc}" data-id="${r.id}">${esc(title(rc,r))}</a>`}
    else if(f.t==="url")v=`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/,"").slice(0,48))}</a>`;
    else if(f.t==="rating")v=`<span style="font-family:var(--mono)">${"●".repeat(v)}${"○".repeat(5-v)}</span>`;
    else v=esc(v);
    return `<dt>${esc(f.l)}</dt><dd>${v}</dd>`}).join("");
  const photos=(x.photos||[]);
  let extra="";
  if(col==="patterns"&&x.tlSlug){const t=S.tl.find(z=>z.s===x.tlSlug);if(t&&t.tg){const g={};t.tg.d.forEach(([l,gr])=>(g[gr]=g[gr]||[]).push(l));extra+=`<div class="stack" style="gap:6px"><h3>From Threadloop</h3><dl class="kv">${t.tg.f.length?`<dt>Fabric</dt><dd>${esc(t.tg.f.join(", "))}</dd>`:""}${t.tg.t.length?`<dt>Pattern types</dt><dd>${esc(t.tg.t.join(", "))}</dd>`:""}${Object.entries(g).map(([gr,ls])=>`<dt>${esc(gr)}</dt><dd>${esc(ls.join(", "))}</dd>`).join("")}</dl></div>`}}
  if(col==="patterns"&&!photos.length&&x.tlSlug){const t=S.tl.find(z=>z.s===x.tlSlug);const st=t&&tlThumb(t);if(st)extra+=`<div class="tlbig" style="${st}"></div>`}
  let stepsHTML="";stepKeys.forEach(k=>{if(!x[k])return;const f=sch.find(z=>z.k===k);if(!f)return;const lines=String(x[k]).split(/\n+/).map(t=>t.replace(/^\s*(\d+[.)]|[-•*])\s*/,"").trim()).filter(Boolean);
    stepsHTML+=`<div class="stack" style="gap:8px"><h3>${esc(f.l)}</h3>${lines.length>1?`<ol class="steps">${lines.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`:`<p style="margin:0;white-space:pre-wrap">${esc(x[k])}</p>`}</div>`});
  if((col==="tips")&&(x.settings||[]).length)extra+=`<div class="stack"><h3>Machine settings</h3>${x.settings.map(dial).join("")}</div>`;
  if(col==="makes"||col==="alterations"){extra+=`<div class="stack"><h3>Machine settings</h3>${(x.settings||[]).map(dial).join("")||`<div class="muted">None recorded.</div>`}</div>`;
    const nl=(x.notions||[]).map(r=>{const n=byId("notions",r.notionId);return n?`<button class="li" data-act="open" data-col="notions" data-id="${n.id}"><span class="tx"><div class="t">${esc(n.name)}</div><div class="s">${esc([n.category,r.qty&&("used "+r.qty)].filter(Boolean).join(" · "))}</div></span></button>`:""}).join("");
    if(nl)extra+=`<div class="stack"><h3>Notions used</h3><div class="list">${nl}</div></div>`;
    if((x.costs||[]).length||x.cost)extra+=`<div class="stack" style="gap:6px"><h3>Cost</h3><div class="costtable">${(x.costs||[]).map(c=>`<span>${esc(c.item||"Item")}</span><span class="amt">${aud(money(c.amount))}</span>`).join("")}${!(x.costs||[]).length&&x.cost?`<span>Total (noted)</span><span class="amt">${esc(x.cost)}</span>`:`<span class="tot">Total</span><span class="amt tot">${aud(costTotal(x))}</span>`}</div></div>`;
    const others=pastFor(x.fabricType,"",x.id);if(others.length)extra+=`<div class="lookup"><div class="eyebrow">Other makes in ${esc(x.fabricType)}</div>${pastBlock(others,{max:3})}</div>`}
  if(col==="patterns"){const ms=S.makes.filter(m=>m.patternId===x.id);const ins=S.inspo.filter(m=>m.patternId===x.id);
    extra+=`<div class="stack"><h3>Made with this pattern</h3>${ms.length?`<div class="list">${ms.map(m=>li("makes",m)).join("")}</div>`:`<div class="muted">Not made yet.</div>`}</div>`;
    if(ins.length)extra+=`<div class="stack"><h3>Linked inspo</h3><div class="grid-cards">${ins.map(m=>card("inspo",m)).join("")}</div></div>`;
    const sug=String(x.suggested||"").split(",").map(norm).filter(Boolean);
    if(sug.length){const fab=S.fabrics.filter(f=>f.archived!=="Yes"&&sug.includes(norm(f.fabricType)));extra+=`<div class="stack"><h3>Fabric in your stash that suits it</h3>${fab.length?`<div class="list">${fab.map(f=>li("fabrics",f)).join("")}</div>`:`<div class="muted">None of the suggested fabric types are in your stash.</div>`}</div>`}}
  if(col==="fabrics"){const ft=norm(x.fabricType);
    const pats=ft?S.patterns.filter(p=>String(p.suggested||"").split(",").map(norm).includes(ft)):[];
    const ms=S.makes.filter(m=>m.fabricId===x.id);
    extra+=`<div class="stack"><h3>Patterns that suit ${esc(x.fabricType||"this fabric")}</h3>${pats.length?`<div class="list">${pats.map(p=>li("patterns",p)).join("")}</div>`:`<div class="muted">Add suggested fabrics to your patterns and matches will show here.</div>`}</div>`;
    if(ms.length)extra+=`<div class="stack"><h3>Used in</h3><div class="list">${ms.map(m=>li("makes",m)).join("")}</div></div>`;

async function importTL(file){const msg=$("#tlmsg");if(!S.db){toast("Can't save: not signed in");return}
  let rows,pack=null;try{const j=JSON.parse(await file.text());if(Array.isArray(j))rows=j;else{pack=j;rows=j.rows}if(!Array.isArray(rows)||!rows.every(r=>Array.isArray(r)&&typeof r[1]==="string"))throw 0}catch(e){msg.textContent="That doesn't look like a Threadloop export file.";return}
  let sheetIds=null;
  if(pack&&Array.isArray(pack.sheets)&&pack.cell){if(!S.assets){msg.textContent="Thumbnails need edit access in the Claude app.";return}sheetIds=[];
    try{for(let i=0;i<pack.sheets.length;i++){msg.textContent=`Uploading thumbnails ${i+1} of ${pack.sheets.length}…`;const du=String(pack.sheets[i]);const bin=atob(du.slice(du.indexOf(",")+1));const arr=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);const b=new Blob([arr],{type:"image/jpeg"});const r=await S.assets.upload(b,{type:"image/jpeg"});sheetIds.push(r.id)}}
    catch(e){msg.textContent=e&&e.code==="quota_or_state"?"Photo storage is full.":`Thumbnail upload failed (${(e&&(e.code||e.message))||"unknown"}). Try again.`;for(const id of sheetIds){try{await S.assets.delete(id)}catch(_){}}return}
    rows=rows.map((r,i)=>{const o=r.slice(0,6);o[6]=pack.ok&&pack.ok[i]===false?-1:i;return o})}
  msg.textContent="Importing "+rows.length+" patterns…";const size=450;const n=Math.ceil(rows.length/size);
  try{for(let i=0;i<n;i++)await S.db.collection("threadloop").doc("c"+String(i).padStart(2,"0")).set({items:rows.slice(i*size,(i+1)*size)});
    const old=(S.tlMeta&&S.tlMeta.chunks)||0;for(let i=n;i<old;i++){try{await S.db.collection("threadloop").doc("c"+String(i).padStart(2,"0")).delete()}catch(_){}}
    const oldSheets=(S.tlMeta&&S.tlMeta.sheets)||[];
    await S.db.collection("threadloop").doc("meta").set({count:rows.length,chunks:n,...(sheetIds?{sheets:sheetIds,cell:pack.cell}:{}),importedOn:new Date().toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})});
    if(sheetIds)for(const id of oldSheets){try{await S.assets.delete(id)}catch(_){}}
    closeSheet();toast(rows.length+" Threadloop patterns imported")}catch(e){msg.textContent=e.code==="quota_exceeded"?"Storage is full.":"Import failed. Try again."}}

function collect(){const f=$("#ef");const o={...S.form.data};

  if(sch.some(f=>f.t==="settings")){readSet();o.settings=S.form.settings.filter(s=>Object.keys(s).length)}

async function shrink(file){if(!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)&&file.type!=="")return file;
  try{const bmp=await createImageBitmap(file);const max=1800;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.86))}catch(e){return file}}
async function upload(files){if(!S.assets){toast("Uploads need edit access in the Claude app");return}
  const msg=$("#upmsg");for(const file of files){S.form.uploading++;msg.textContent="Uploading…";
   try{const isV=file.type.startsWith("video/");
     if(file.type==="video/quicktime"){toast("iPhone .mov videos can't be stored. Save it as a link, or export as MP4.");continue}
     const b=isV?file:await shrink(file);
     const r=await S.assets.upload(b,isV?undefined:{type:b.type&&b.type!==""?b.type:"image/jpeg"});
     S.form.photos.push(isV?{id:r.id,v:1}:{id:r.id});drawThumbs()}
   catch(e){toast(e.code==="too_large"?"That file is over 20 MB":e.code==="unsupported_type"?"That file type can't be stored":e.code==="quota_or_state"?"Photo storage is full":"Upload failed")}
   finally{S.form.uploading--}}msg.textContent=""}

function parseLine(l){l=l.trim();if(!l)return null;
  if(/^https?:\/\//i.test(l)){const o={threadloop:/threadloop\.app/i.test(l)?l:undefined,link:/threadloop\.app/i.test(l)?undefined:l};
    const seg=l.replace(/[?#].*$/,"").replace(/\/+$/,"").split("/").pop()||"Pattern";o.name=decodeURIComponent(seg).replace(/^\d+-?/,"").replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()).trim()||"Pattern";o.notes="Name taken from the link; check it.";return o}
  const m=l.split(/\s*:\s*/);if(m.length>1&&m[0])return {designer:m[0],name:m.slice(1).join(": ")};return {name:l}}
async function bulkGo(){if(!S.db)return toast("Can't save: not signed in");const lines=$("#bulkIn").value.split("\n").map(parseLine).filter(Boolean);const st=$("#bulkStatus").value;
  if(!lines.length)return toast("Paste at least one line");let n=0;
  for(const p of lines){const o={...p,status:st,createdAt:Date.now(),updatedAt:Date.now()};for(const k in o)if(o[k]===undefined)delete o[k];
    try{await S.db.collection("patterns").doc(uid()).set(o);n++}catch(e){if(e.code==="quota_exceeded")break}}
  closeSheet();toast(`Added ${n} pattern${n===1?"":"s"}`);location.hash="#patterns"}

async function exportAll(){const data={app:"sewing-book",v:2,exported:new Date().toISOString(),docs:{},photos:{}};

  toast("Packing backup…");
  for(const [id] of LOCALURL){try{const b=await IDB.get("blobs",id);if(b)data.photos[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}catch(_){}}
  const name="sewing-book-backup-"+new Date().toISOString().slice(0,10)+".json";

async function restoreBackup(file){let j;try{j=JSON.parse(await file.text())}catch(e){toast("That isn't a Sewing Book backup");return}
  if(!j||j.app!=="sewing-book"||!j.docs){toast("That isn't a Sewing Book backup");return}
  let n=0;for(const [id,du] of Object.entries(j.photos||{})){try{const b=await (await fetch(du)).blob();await IDB.put("blobs",b,id);if(!LOCALURL.has(id))LOCALURL.set(id,URL.createObjectURL(b))}catch(_){}}
  for(const [c,list] of Object.entries(j.docs)){for(const d of list||[]){const {id,...rest}=d;if(!id)continue;await S.db.collection(c).doc(id).set(rest);n++}}
  toast(`Restored ${n} entries`);render()}

/* ---------- on-device storage ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("sewing-book",1)}catch(e){rej(e);return}r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("docs");d.createObjectStore("blobs")};r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(store,k){return IDB.req(store,"readonly",s=>s.get(k))},
  put(store,v,k){return IDB.req(store,"readwrite",s=>s.put(v,k))},
  del(store,k){return IDB.req(store,"readwrite",s=>s.delete(k))},
  entries(store){return new Promise((res,rej)=>{const t=IDB.db.transaction(store);const s=t.objectStore(store);const k=s.getAllKeys(),v=s.getAll();t.oncomplete=()=>res(k.result.map((x,i)=>[x,v.result[i]]));t.onerror=()=>rej(t.error)})}};
function makeDB(){const local={},base={},subs={};
  const emit=c=>{const merged=Object.assign({},base[c]||{},local[c]||{});const docs=Object.entries(merged).map(([id,d])=>({id,exists:true,data:()=>d}));(subs[c]||[]).forEach(fn=>{try{fn({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}})}catch(e){console.error(e)}})};
  const api={local,base,emit,collection(c){return{
    onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);setTimeout(()=>emit(c),0);return()=>{subs[c]=subs[c].filter(f=>f!==fn)}},
    doc(id){id=id||uid();return{id,
      async get(){const d=(local[c]||{})[id]||(base[c]||{})[id];return{id,exists:!!d,data:()=>d}},
      async set(d){d=JSON.parse(JSON.stringify(d));await IDB.put("docs",d,c+"/"+id);(local[c]=local[c]||{})[id]=d;emit(c)},
      async update(d){const cur=(local[c]||{})[id]||(base[c]||{})[id];if(!cur)throw{code:"invalid_argument"};await this.set({...cur,...d})},
      async delete(){await IDB.del("docs",c+"/"+id);if(local[c])delete local[c][id];if(base[c])delete base[c][id];emit(c)}}}}}};
  return api}
function saveFile({filename,data}){const file=new File([data],filename,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:filename});
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return Promise.resolve()}

/* ---------- boot ---------- */
route();
(async()=>{
  try{await IDB.open()}catch(e){S.db=null;S.ready=true;render();return}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  const db=makeDB();S.db=db;
  S.assets={async upload(b){const id=uid()+uid();await IDB.put("blobs",b,id);const url=URL.createObjectURL(b);LOCALURL.set(id,url);return{id,url,sizeBytes:b.size,contentType:b.type}},
    async delete(id){if(/[\/.]/.test(id))return{deleted:false};await IDB.del("blobs",id);const u=LOCALURL.get(id);if(u)URL.revokeObjectURL(u);LOCALURL.delete(id);return{deleted:true}}};
  S.downloads={save:saveFile};S.sample=null;
  for(const [id,b] of await IDB.entries("blobs"))LOCALURL.set(id,URL.createObjectURL(b));
  const seen=new Set((await IDB.get("docs","_meta/seeded"))||[]);
  for(const [k,d] of await IDB.entries("docs")){if(k.startsWith("_meta/"))continue;const i=k.indexOf("/");const c=k.slice(0,i),id=k.slice(i+1);(db.local[c]=db.local[c]||{})[id]=d}
  {const mid="mvxovqilpsnemr",m=(db.local.makes||{})[mid];if(m&&!(db.local.alterations||{})[mid]){const st={Idea:"To do",Planned:"Planned",Cutting:"In progress",Sewing:"In progress",Finished:"Done",Abandoned:"Gave up"}[m.status]||"To do";const a={...m,status:st};await IDB.put("docs",a,"alterations/"+mid);(db.local.alterations=db.local.alterations||{})[mid]=a;await IDB.del("docs","makes/"+mid);delete db.local.makes[mid];seen.add("alterations/"+mid);await IDB.put("docs",[...seen],"_meta/seeded")}}
  try{const seed=await (await fetch("data/seed.json",{cache:"no-cache"})).json();let added=false;
    for(const [c,list] of Object.entries(seed))for(const d of list){const key=c+"/"+d.id;if(seen.has(key))continue;seen.add(key);added=true;if(!(db.local[c]||{})[d.id]){const {id,...rest}=d;await IDB.put("docs",rest,key);(db.local[c]=db.local[c]||{})[id]=rest}}
    if(added)await IDB.put("docs",[...seen],"_meta/seeded")}catch(_){}
  try{const tl=await (await fetch("data/threadloop.json",{cache:"no-cache"})).json();db.base.threadloop={};tl.docs.forEach(({id,...d})=>db.base.threadloop[id]=d)}catch(_){S.tlFail=true}
  let rT;const soon=()=>{clearTimeout(rT);rT=setTimeout(()=>{if(!S.form)render()},40)};
  ["makes","alterations","tips","fitting","inspo","patterns","fabrics","notions","machines","settings","threadloop"].forEach(c=>db.collection(c).onSnapshot(snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(c==="settings"){S.settings={};docs.forEach(d=>S.settings[d.id]=d)}else if(c==="threadloop")setTL(docs);else{S[c]=docs;if(c==="patterns")refreshPatDL()}
    S.ready=true;soon()}));
})();
